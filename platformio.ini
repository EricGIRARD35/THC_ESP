; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = 
    -D USER_SETUP_LOADED=1
    -D ILI9486_DRIVER=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I include
lib_deps = 
	SPI
	bodmer/TFT_eSPI@^2.5.31
	lvgl/lvgl @ ^8.3.11 
	https://github.com/adafruit/Adafruit_ADS1X15.git
	AccelStepper
	https://github.com/br3ttb/Arduino-PID-Library.git
	626
	TFT_eSPI
	hotchpotch/HDC1000@0.0.0-alpha+sha.969d92d850
    XPT2046_Touchscreen

lib_ldf_mode = deep+  ; Permet de chercher les dépendances imbriquées (comme SPI dans BusIO)
; Vitesse upload
upload_speed = 921600